{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h1>Finalize Bid</h1>
            <h3>Contact Information</h3>
        </div>

        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <h4 class="mb-3">Address</h4>
                <div class="mb-3">
                    {{ address_form.as_p }}
                </div>
                <hr>
                <h4 class="mb-3">National ID</h4>
                <div class="mb-3">
                    {{ finalization_form.as_p }}
                </div>

                <div class="d-flex justify-content-between mt-4">
                     <a href="{% url 'bids:my_bids' %}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-outline-secondary">
                        Continue to Payment
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
